[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sfc-autoscale"
version = "0.1.0"
description = "Predictive, contention-aware SFC embedding with multi-strategy VNF auto-scaling for NFV-based 5G core networks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "SFC-AutoScale Contributors" }]
keywords = ["nfv", "sfc", "vnf", "auto-scaling", "5g", "traffic-prediction", "gru"]

# Core runtime deps are intentionally light so the simulator runs anywhere, for free.
dependencies = [
    "numpy>=1.24",
    "networkx>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The PyTorch GRU is an *optional* extra. Without it, the dependency-free
# NumPy GRU and classical baselines are used, so the system is still fully testable.
torch = ["torch>=2.0"]
plot = ["matplotlib>=3.7", "pandas>=2.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1", "mypy>=1.5"]
all = ["torch>=2.0", "matplotlib>=3.7", "pandas>=2.0", "pytest>=7.0", "ruff>=0.1"]

[project.scripts]
sfc-autoscale = "sfc_autoscale.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sfc_autoscale = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
